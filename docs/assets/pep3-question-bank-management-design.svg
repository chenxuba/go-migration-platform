<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 42px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #152033; }
      .subtitle { font: 400 19px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #526173; }
      .section-title { font: 700 23px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .box-title { font: 700 20px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 16px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #526173; }
      .small { font: 400 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #657386; }
      .badge { font: 700 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #ffffff; }
      .table-title { font: 700 17px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #172033; }
      .table-text { font: 400 14px "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #526173; }
      .panel { fill: #ffffff; stroke: #d9e1ec; stroke-width: 1.4; }
      .panel-soft { fill: #fbfcfe; stroke: #d9e1ec; stroke-width: 1.2; }
      .blue { fill: #eaf3ff; stroke: #92b8ea; }
      .green { fill: #e9f7ef; stroke: #91d1aa; }
      .amber { fill: #fff4df; stroke: #efc26e; }
      .red { fill: #fff0f0; stroke: #e9a0a0; }
      .violet { fill: #f2efff; stroke: #b8abe9; }
      .teal { fill: #e7f7f7; stroke: #88d0cf; }
      .dark-blue { fill: #2563eb; }
      .dark-green { fill: #20915b; }
      .dark-amber { fill: #b87504; }
      .dark-violet { fill: #6d57c8; }
      .dark-teal { fill: #168a8a; }
      .arrow { stroke: #708196; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #9baabe; stroke-width: 1.8; fill: none; marker-end: url(#arrowSoft); }
      .divider { stroke: #d9e1ec; stroke-width: 1.2; }
      .shadow { filter: url(#shadow); }
    </style>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#223047" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#708196"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9baabe"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1100"/>

  <text x="64" y="76" class="title">PEP3 题库管理设计图</text>
  <text x="64" y="112" class="subtitle">基于 assessment_scale_* 静态题库结构：PEP3 / 2025-92题版 / 172题 / 13分量表</text>

  <rect x="1168" y="48" width="84" height="34" rx="17" class="dark-blue"/>
  <text x="1210" y="70" text-anchor="middle" class="badge">PEP3</text>
  <rect x="1264" y="48" width="126" height="34" rx="17" class="dark-green"/>
  <text x="1327" y="70" text-anchor="middle" class="badge">172 道题</text>
  <rect x="1402" y="48" width="134" height="34" rx="17" class="dark-violet"/>
  <text x="1469" y="70" text-anchor="middle" class="badge">13 分量表</text>

  <rect x="48" y="142" width="1504" height="310" rx="22" class="panel shadow"/>
  <text x="76" y="184" class="section-title">一、管理端页面布局</text>

  <rect x="76" y="210" width="224" height="196" rx="16" class="blue"/>
  <rect x="94" y="230" width="56" height="28" rx="14" class="dark-blue"/>
  <text x="122" y="249" text-anchor="middle" class="badge">概览</text>
  <text x="94" y="286" class="box-title">顶部概览</text>
  <text x="94" y="318" class="box-text">量表编码 / 当前版本</text>
  <text x="94" y="346" class="box-text">题目数 / 领域数</text>
  <text x="94" y="374" class="box-text">来源文件 / 数据状态</text>

  <rect x="332" y="210" width="244" height="196" rx="16" class="teal"/>
  <rect x="350" y="230" width="56" height="28" rx="14" class="dark-teal"/>
  <text x="378" y="249" text-anchor="middle" class="badge">筛选</text>
  <text x="350" y="286" class="box-title">查询筛选</text>
  <text x="350" y="318" class="box-text">题号 / 项目 / 材料</text>
  <text x="350" y="346" class="box-text">分量表 / 校对状态</text>
  <text x="350" y="374" class="box-text">来源页 / 题目类型</text>

  <rect x="608" y="210" width="260" height="196" rx="16" class="green"/>
  <rect x="626" y="230" width="68" height="28" rx="14" class="dark-green"/>
  <text x="660" y="249" text-anchor="middle" class="badge">导航</text>
  <text x="626" y="286" class="box-title">左侧领域导航</text>
  <text x="626" y="318" class="box-text">沟通：CVP / EL / RL</text>
  <text x="626" y="346" class="box-text">运动：FM / GM / VMI</text>
  <text x="626" y="374" class="box-text">行为：AE / SR / CMB / CVB</text>

  <rect x="900" y="210" width="268" height="196" rx="16" class="amber"/>
  <rect x="918" y="230" width="68" height="28" rx="14" class="dark-amber"/>
  <text x="952" y="249" text-anchor="middle" class="badge">列表</text>
  <text x="918" y="286" class="box-title">题目列表</text>
  <text x="918" y="318" class="box-text">题号 / 分量表 / 项目</text>
  <text x="918" y="346" class="box-text">材料 / 评分 / 来源页</text>
  <text x="918" y="374" class="box-text">记录字段数 / 状态</text>

  <rect x="1200" y="210" width="304" height="196" rx="16" class="violet"/>
  <rect x="1218" y="230" width="68" height="28" rx="14" class="dark-violet"/>
  <text x="1252" y="249" text-anchor="middle" class="badge">详情</text>
  <text x="1218" y="286" class="box-title">题目详情抽屉</text>
  <text x="1218" y="318" class="box-text">基础信息 / 施测方法</text>
  <text x="1218" y="346" class="box-text">评分标准 / 评分选项</text>
  <text x="1218" y="374" class="box-text">记录字段 / 来源 / 变更</text>

  <path d="M 300 308 L 330 308" class="arrow-soft"/>
  <path d="M 576 308 L 606 308" class="arrow-soft"/>
  <path d="M 868 308 L 898 308" class="arrow-soft"/>
  <path d="M 1168 308 L 1198 308" class="arrow-soft"/>

  <rect x="48" y="482" width="936" height="452" rx="22" class="panel shadow"/>
  <text x="76" y="524" class="section-title">二、核心数据关系</text>

  <rect x="374" y="556" width="250" height="94" rx="14" class="blue"/>
  <text x="499" y="588" text-anchor="middle" class="table-title">assessment_scale_dataset</text>
  <text x="398" y="619" class="table-text">scale_code / scale_version</text>
  <text x="398" y="642" class="table-text">data_status / sources_json</text>

  <rect x="84" y="700" width="252" height="110" rx="14" class="green"/>
  <text x="210" y="732" text-anchor="middle" class="table-title">assessment_scale_domain</text>
  <text x="108" y="763" class="table-text">domain_code：CVP / EL / RL...</text>
  <text x="108" y="786" class="table-text">domain_json：题数 / 满分 / 组合</text>

  <rect x="374" y="700" width="252" height="110" rx="14" class="amber"/>
  <text x="500" y="732" text-anchor="middle" class="table-title">assessment_scale_item</text>
  <text x="398" y="763" class="table-text">item_no：1-172</text>
  <text x="398" y="786" class="table-text">item_json：材料 / 方法 / 标准</text>

  <rect x="664" y="700" width="276" height="110" rx="14" class="violet"/>
  <text x="802" y="732" text-anchor="middle" class="table-title">item_record_field</text>
  <text x="688" y="763" class="table-text">item_no + field_key</text>
  <text x="688" y="786" class="table-text">field_json：文本 / 单选 / 多选</text>

  <rect x="374" y="846" width="252" height="60" rx="14" class="teal"/>
  <text x="500" y="872" text-anchor="middle" class="table-title">assessment_scale_norm_record</text>
  <text x="398" y="895" class="table-text">norm_json：常模换算记录</text>

  <path d="M 436 650 C 348 674 284 682 230 700" class="arrow"/>
  <path d="M 500 650 L 500 698" class="arrow"/>
  <path d="M 562 650 C 646 674 710 682 782 700" class="arrow"/>
  <path d="M 500 810 L 500 844" class="arrow"/>
  <path d="M 336 755 L 372 755" class="arrow-soft"/>
  <path d="M 626 755 L 662 755" class="arrow-soft"/>
  <text x="348" y="736" class="small">domain_code</text>
  <text x="630" y="736" class="small">item_no</text>

  <rect x="1020" y="482" width="532" height="452" rx="22" class="panel shadow"/>
  <text x="1048" y="524" class="section-title">三、数据流与发布控制</text>

  <rect x="1064" y="558" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1153" y="588" text-anchor="middle" class="box-title">JSON / 模板种子</text>
  <text x="1153" y="615" text-anchor="middle" class="small">题库、领域、记录字段</text>

  <rect x="1304" y="558" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1393" y="588" text-anchor="middle" class="box-title">education-service</text>
  <text x="1393" y="615" text-anchor="middle" class="small">启动同步静态数据</text>

  <path d="M 1242 594 L 1302 594" class="arrow"/>

  <rect x="1064" y="680" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1153" y="710" text-anchor="middle" class="box-title">assessment_scale_*</text>
  <text x="1153" y="737" text-anchor="middle" class="small">统一持久化题库</text>

  <rect x="1304" y="680" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1393" y="710" text-anchor="middle" class="box-title">管理端题库 API</text>
  <text x="1393" y="737" text-anchor="middle" class="small">列表 / 详情 / 保存 / 发布</text>

  <path d="M 1393 630 C 1393 656 1153 656 1153 678" class="arrow"/>
  <path d="M 1242 716 L 1302 716" class="arrow"/>

  <rect x="1064" y="802" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1153" y="832" text-anchor="middle" class="box-title">platform-admin</text>
  <text x="1153" y="859" text-anchor="middle" class="small">题库管理工作台</text>

  <rect x="1304" y="802" width="178" height="72" rx="14" class="panel-soft"/>
  <text x="1393" y="832" text-anchor="middle" class="box-title">机构端测评录入</text>
  <text x="1393" y="859" text-anchor="middle" class="small">读取已发布版本</text>

  <path d="M 1393 752 C 1393 778 1153 778 1153 800" class="arrow"/>
  <path d="M 1242 838 L 1302 838" class="arrow"/>

  <line x1="1064" y1="920" x2="1482" y2="920" class="divider"/>
  <text x="1064" y="960" class="box-title">发布状态</text>
  <rect x="1170" y="938" width="78" height="34" rx="17" class="dark-amber"/>
  <text x="1209" y="960" text-anchor="middle" class="badge">OCR草稿</text>
  <rect x="1264" y="938" width="78" height="34" rx="17" class="dark-teal"/>
  <text x="1303" y="960" text-anchor="middle" class="badge">人工校对</text>
  <rect x="1358" y="938" width="66" height="34" rx="17" class="dark-violet"/>
  <text x="1391" y="960" text-anchor="middle" class="badge">待发布</text>
  <rect x="1440" y="938" width="66" height="34" rx="17" class="dark-green"/>
  <text x="1473" y="960" text-anchor="middle" class="badge">已发布</text>
  <path d="M 1248 955 L 1262 955" class="arrow-soft"/>
  <path d="M 1342 955 L 1356 955" class="arrow-soft"/>
  <path d="M 1424 955 L 1438 955" class="arrow-soft"/>

  <rect x="48" y="964" width="936" height="84" rx="18" class="panel-soft"/>
  <text x="76" y="1000" class="section-title">四、落地优先级</text>
  <text x="76" y="1034" class="box-text">1. 平台端题库抽屉从 P1/P3 静态样例改为调用完整题库接口。</text>
  <text x="594" y="1034" class="box-text">2. 后端补齐列表、详情、保存记录字段、发布版本接口。</text>

  <text x="1552" y="1072" text-anchor="end" class="small">docs/assets/pep3-question-bank-management-design.png</text>
</svg>
